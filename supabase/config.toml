project_id = "wpr-pet-contest"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match this to the Postgres version of the linked project.
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Catches outbound mail locally so receipt testing never emails a real person.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

# The `pets` bucket is created in migrations/0004_storage.sql, not here.
# Declaring it in both places would let local and production drift apart.

[auth]
enabled = true
# Local only. Production auth settings (site URL, redirect URLs, providers) live
# in the dashboard; CI never runs `supabase config push`, and nobody should,
# because this file would point production login redirects at localhost.
site_url = "http://localhost:5173"
jwt_expiry = 3600
# Admins are added by invite. Nobody signs themselves up for a moderation queue.
enable_signup = false

# Must stay true. Despite the name, the CLI maps this to "email provider
# enabled": false turns off email sign-IN as well, and the admin panel's
# password login fails with "Email logins are disabled". Self-signup is already
# refused by [auth] enable_signup = false above.
[auth.email]
enable_signup = true

[edge_runtime]
enabled = true
policy = "oneshot"

# All three functions are called by parties that do not hold a Supabase JWT:
# anonymous visitors and Stripe. Each does its own authentication instead —
# submit-entry validates input, create-checkout validates against the DB, and
# stripe-webhook verifies the Stripe signature. Leaving verify_jwt on here is
# the single most common reason a webhook silently 401s in production.
[functions.submit-entry]
verify_jwt = false

[functions.create-checkout]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# The two staff functions take the moderator's session token, but check it in
# code (requireAdmin: is_admin() evaluated by Postgres as that user) rather than
# at the gateway, which only understands the legacy JWT secret. notify also
# accepts a scheduled caller holding CRON_SECRET, which is not a JWT at all.
[functions.moderate]
verify_jwt = false

[functions.notify]
verify_jwt = false

# Same arrangement as notify: a staff session, or the scheduled caller's
# CRON_SECRET.
[functions.health]
verify_jwt = false

[functions.disqualify]
verify_jwt = false

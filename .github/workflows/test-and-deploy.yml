name: test and deploy

on:
  push:
    branches: [main]
  pull_request:

# Two merges in quick succession would otherwise run `db push` concurrently
# against the same project. Migrations are not safe to interleave.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: a new CLI can change platform defaults underneath the tests
          # (table grants did exactly that). Bump deliberately, then run the
          # suite locally.
          version: 2.111.0

      # Boots the full local stack, applies every migration in order, then runs
      # the pgTAP suite. A broken migration fails here, not in production the
      # morning the contest opens.
      - run: supabase start
      - run: supabase test db

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - run: deno test --allow-env --allow-read supabase/functions/_shared

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # No env: proves the build succeeds (and skips share pages) without secrets.
      - run: npm run build

  deploy:
    needs: [database, functions, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - run: supabase link --project-ref "$PROJECT_ID"
      - run: supabase db push
      # Every function, explicitly. A new function that is not listed here is
      # a function that silently never ships.
      - run: |
          for fn in submit-entry create-checkout stripe-webhook moderate notify; do
            supabase functions deploy "$fn"
          done

# The front end deploys from pages.yml, which also rebuilds the per-pet share
# pages on a schedule.

name: test and deploy

on:
  push:
    branches: [main]
  pull_request:

# Two merges in quick succession would otherwise run `db push` concurrently
# against the same project. Migrations are not safe to interleave.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots the full local stack, applies every migration in order, then runs
      # the pgTAP suite. A broken migration fails here, not in production the
      # morning the contest opens.
      - run: supabase start
      - run: supabase test db

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref "$PROJECT_ID"
      - run: supabase db push
      - run: supabase functions deploy submit-entry
      - run: supabase functions deploy create-checkout
      - run: supabase functions deploy stripe-webhook

# The GitHub Pages job for the React front end gets added here once that app
# exists. Deliberately not stubbed: a workflow step that references a missing
# build directory fails every run and trains you to ignore red checks.

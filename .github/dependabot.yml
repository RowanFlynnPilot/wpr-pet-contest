# Dependency updates arrive as pull requests, and CI (including the browser
# and integration suites) runs on each before anyone merges. Minor and patch
# updates come grouped into one weekly PR so they are not a chore; major
# versions come one at a time, because React, Vite and Stripe majors change
# behavior and deserve a look.
#
# Not covered: the edge functions' Deno imports (npm:stripe@17,
# jsr:@supabase/supabase-js@2), which are pinned to a major in source, and the
# Supabase CLI version pinned in the workflows. Bump those deliberately.

version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />
    <title>Cutest Pet in Marathon County — Wausau Pilot &amp; Review</title>
    <meta name="description" content="Enter your pet free, then vote with vote packs. A share of every pack goes to local animal shelters. A Wausau Pilot & Review reader contest." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="./wpr-typewriter-badge.png" />
    <!-- iOS ignores SVG touch icons and falls back to a page screenshot. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <!-- Added to a phone's home screen, it opens as itself, with its own name and icon. -->
    <link rel="manifest" href="./site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wausau Pilot &amp; Review" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="Cutest Pet in Marathon County — Wausau Pilot &amp; Review" />
    <meta property="og:description" content="Enter your pet free. Vote packs benefit local animal shelters." />
    <meta property="og:image" content="%SITE_URL%og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cutest Pet in Marathon County, a Wausau Pilot &amp; Review contest" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%og-card.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The faces load without blocking the first paint: the stylesheet arrives as print media
         and switches to all once it is in; the size-adjusted Arial fallbacks hold the layout. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=JetBrains+Mono:wght@500;700&family=Public+Sans:ital,wght@0,400..800;1,400&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=JetBrains+Mono:wght@500;700&family=Public+Sans:ital,wght@0,400..800;1,400&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=JetBrains+Mono:wght@500;700&family=Public+Sans:ital,wght@0,400..800;1,400&display=swap" /></noscript>
  </head>

    <script type="module" src="/src/main.jsx"></script>
